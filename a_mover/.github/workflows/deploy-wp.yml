name: Deploy WordPress a Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/la-dulceria-wp/**'
      - '.github/workflows/deploy-wp.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Subir cambios por FTP

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Debug secretos
        run: |
          echo "Longitud FTP_SERVER: ${#FTP_SERVER}"
          echo "Longitud FTP_USERNAME: ${#FTP_USERNAME}"
          echo "Longitud FTP_PASSWORD: ${#FTP_PASSWORD}"
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow no;
            open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
            mirror -R --delete --verbose \
              src/components/la-dulceria-wp/wp-content/ \
              /public_html/wp-content/;
            bye
          "

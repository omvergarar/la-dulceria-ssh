name: Deploy WordPress a Hostinger

on:
  push:
    branches:
      - main
    paths:
      - 'src/components/la-dulceria-wp/**'
      - '.github/workflows/deploy-wp.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Subir cambios por FTP

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Verificar secretos
        run: |
          if [ -z "${{ secrets.FTP_SERVER }}" ]; then
            echo "ERROR: FTP_SERVER esta vacio"
          else
            echo "FTP_SERVER tiene valor (longitud: ${#FTP_SERVER})"
          fi
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./src/components/la-dulceria-wp/wp-content/
          server-dir: /public_html/wp-content/
          exclude: |
            **/.git*
            **/.git*/**
            **/*.md
